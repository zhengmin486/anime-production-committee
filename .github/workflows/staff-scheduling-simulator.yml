name: Staff scheduling simulator
on:
  pull_request:
    paths:
      - "scripts/staff_scheduling_simulator.py"
      - "scripts/tests/test_staff_scheduling_simulator.py"
      - "scripts/fixtures/staff_templates.json"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest scripts.tests.test_staff_scheduling_simulator -v
      - run: python scripts/staff_scheduling_simulator.py --deadline 14 --workloads 30,60,90,120
