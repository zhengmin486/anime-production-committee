name: docs check

# 文档结构与链接门禁：决定的 front matter 字段、ADR 编号、active canonical_for 唯一性，
# 以及 docs 下的本地 Markdown/JSON/图片链接。依据 docs/decisions/ADR-0001-decision-record-process.md。

on:
  push:
    paths:
      - "docs/**"
      - "scripts/check_docs.py"
      - "README.md"
      - "CONTRIBUTING.md"
      - "package.json"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_docs.py"
      - "README.md"
      - "CONTRIBUTING.md"
      - "package.json"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    name: 文档结构与链接
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run docs check
        run: python scripts/check_docs.py
