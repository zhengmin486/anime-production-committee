name: recruit oracle tests

on:
  push:
    paths:
      - "scripts/lib/recruit-oracle.mjs"
      - "scripts/check-recruit-cases.mjs"
      - "scripts/recruit.test.mjs"
      - "docs/fixtures/recruit_cases.json"
      - "package.json"
      - ".github/workflows/recruit-tests.yml"
  pull_request:
    paths:
      - "scripts/lib/recruit-oracle.mjs"
      - "scripts/check-recruit-cases.mjs"
      - "scripts/recruit.test.mjs"
      - "docs/fixtures/recruit_cases.json"
      - "package.json"
      - ".github/workflows/recruit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recruit:
    name: 招聘 Oracle 测试
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate recruitment contract cases
        run: npm run validate:recruit
      - name: Run recruitment unit tests
        run: npm run test:recruit
